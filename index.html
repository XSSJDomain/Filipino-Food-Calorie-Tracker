<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pusang Bulk, Asong Cut</title>

  <link rel="stylesheet" href="style.css"/>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

<header class="hero">
  <h1>🐱 Pusang Bulk, Asong Cut 🐶</h1>
  <p>Track Calories • Track Protein • Bulk or Cut</p>
</header>

<div class="container">

  <!-- Setup -->
  <section class="card">
    <h2>Tracker Setup</h2>

    <input id="weight" type="number" placeholder="Weight (kg)">
    <input id="height" type="number" placeholder="Height (cm)">
    <input id="age" type="number" placeholder="Age">

    <select id="gender">
      <option value="male">Male</option>
      <option value="female">Female</option>
    </select>

    <select id="activity">
      <option value="1.2">Sedentary</option>
      <option value="1.375">Light Activity</option>
      <option value="1.55">Moderate Activity</option>
      <option value="1.725">Very Active</option>
    </select>

    <select id="goal">
      <option value="maintain">Maintain</option>
      <option value="bulk">Bulk</option>
      <option value="cut">Cut</option>
    </select>

    <button onclick="calculateNeeds()">Calculate</button>
  </section>

  <!-- Targets -->
  <section class="card">
    <h2>Daily Targets</h2>

    <p>Calories: <span id="caloriesResult">0</span> kcal</p>
    <p>Protein: <span id="proteinResult">0</span> g</p>
  </section>

  <!-- Log Food -->
  <section class="card">
    <h2>Log Food</h2>

    <select id="foodSelect"></select>

    <select id="unitSelect">
      <option value="grams">Grams (g)</option>
      <option value="ounce">Ounce (oz)</option>
      <option value="ml">Milliliters (ml)</option>
      <option value="serving">Serving</option>
      <option value="piece">Piece</option>
    </select>

    <input id="foodAmount" type="number" placeholder="Amount">

    <button onclick="addFood()">Log Food</button>

    <ul id="foodList"></ul>

    <p>Total Calories: <span id="totalCalories">0</span></p>
    <p>Total Protein: <span id="totalProtein">0</span> g</p>
  </section>

</div>

<script src="foods.js"></script>
<script src="script.js"></script>

</body>
</html>
